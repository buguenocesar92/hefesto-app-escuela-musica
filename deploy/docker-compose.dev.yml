# ---------------------------------------------------------------------------
# Composición de DESARROLLO
# ---------------------------------------------------------------------------
# ADVERTENCIA HONESTA: este archivo NO se probó. En el entorno donde se escribió
# el código no había Docker. Ver docs/10-PRUEBAS-Y-ESTADO.md.
#
# QUÉ SE PUBLICA AQUÍ, Y POR QUÉ AQUÍ SÍ
# --------------------------------------
# En desarrollo se publican PostgreSQL (5432), Redis (6379), la API (8080) y la
# interfaz (3000), y por eso no hay dominio ni proxy: quien desarrolla trabaja
# directamente sobre cada pieza.
#
# En producción NO se publica nada de eso. Ver docker-compose.prod.yml.
#
# ESTA DIFERENCIA ES A PROPÓSITO
# -----------------------------
# Que en desarrollo se publiquen los puertos de la base es cómodo. Copiar esa
# configuración a producción es el error clásico: deja PostgreSQL reachable desde
# internet. Por eso los dos archivos son distintos y no se comparte un fragmento
# entre ellos.
# ---------------------------------------------------------------------------

name: escuela-musica-dev

services:

  # -------------------------------------------------------------------------
  # Base de datos
  # -------------------------------------------------------------------------
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: escuela_musica
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-escuela_musica_admin}
      # En desarrollo la clave puede ser simple, pero NO se deja vacía: una
      # base sin clave acepta conexiones desde cualquier origen de la red de
      # Docker.
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env}
      # Las páginas UTF-8 de PostgreSQL con la configuración regional del
      # contenedor vienen en C: sin esto, "Ñ" y "á" se rompen al ordenar.
      LANG: es_CL.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-CL"
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-escuela_musica_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env de la raíz}
    ports:
      # Solo en desarrollo. La base nunca se publica en producción.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escuela_musica_app -d escuela_musica"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # Caché y cola
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------------
  api:
    image: escuela-musica-api-dev
    build:
      context: ../api
      dockerfile: ../deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?defina APP_KEY en el archivo .env de la raíz}
      APP_URL: http://localhost:8080
      APP_TIMEZONE: America/Santiago
      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: escuela_musica
      DB_USERNAME: escuela_musica_app
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env de la raíz}

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "false"

      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../api:/var/www/html
      - api_storage:/var/www/html/storage

  # -------------------------------------------------------------------------
  # Trabajos en segundo plano
  # -------------------------------------------------------------------------
  cola:
    image: escuela-musica-api-dev
    build:
      context: ../api
      dockerfile: ../deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?defina APP_KEY en el archivo .env de la raíz}
      APP_TIMEZONE: America/Santiago

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: escuela_musica
      DB_USERNAME: escuela_musica_app
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env de la raíz}

      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      SESSION_DRIVER: file

      # Las tres reglas de negocio se dejan SIN VALOR a propósito en
      # desarrollo: el comportamiento por omisión del sistema es justamente el
      # que hay que ver, que es "nadie decidió esto todavía".
      ESCUELA_MUSICA_ABSENCIA_CONSUME_PLAN: ""
      ESCUELA_MUSICA_DIAS_RECUPERACION: ""
      ESCUELA_MUSICA_DIAS_AVISO_MOROSIDAD: ""
      ESCUELA_MUSICA_ROLES_QUE_VEN_PAGOS: "direccion,administracion"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ../api:/var/www/html
      - api_storage:/var/www/html/storage

  # -------------------------------------------------------------------------
  # Programador de tareas
  # -------------------------------------------------------------------------
  planificador:
    image: escuela-musica-api-dev
    build:
      context: ../api
      dockerfile: ../deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:?defina APP_KEY en el archivo .env de la raíz}
      APP_TIMEZONE: America/Santiago
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: escuela_musica
      DB_USERNAME: escuela_musica_app
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env de la raíz}
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ESCUELA_MUSICA_DIAS_RECUPERACION: ""
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ../api:/var/www/html
      - api_storage:/var/www/html/storage

  # -------------------------------------------------------------------------
  # Interfaz (Nuxt)
  # -------------------------------------------------------------------------
  web:
    build:
      context: ../web
      dockerfile: ../deploy/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_BASE: http://localhost:3000
      NUXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../web:/app
      - /app/node_modules
      - /app/.nuxt

volumes:
  postgres_dev:
  api_storage: