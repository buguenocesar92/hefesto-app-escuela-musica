; ---------------------------------------------------------------------------
; Configuración de PHP para la API
; ---------------------------------------------------------------------------
; Los valores de memoria y de tiempo son los mismos que usan las demás
; aplicaciones de Hefesto para este tipo de servicio, y NO han sido medidos en
; esta aplicación en particular. Si el uso real lo exige, se ajustan acá.
; ---------------------------------------------------------------------------

; No se muestran errores en la respuesta: un detalle interno puede incluir rutas
; del servidor o estructura de la base. El error va al registro, no a la pantalla.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; Exposición de errores: los avisos y notas no llegan al navegador.
; Se registra todo internamente.
expose_php = Off

; Límites. El cuerpo se limita en nginx (12M); aquí se limita la ejecución.
memory_limit = 256M
max_execution_time = 30

; Tamaño máximo de un archivo subido (autorizaciones escaneadas).
upload_max_filesize = 10M
post_max_size = 12M

; Fecha y hora.
date.timezone = America/Santiago

; Sesión: cookie sin acceso por JavaScript y con SameSite.
; La cookie de sesión no se persiste: se pierde al cerrar el navegador. Para una
; aplicación interna de una PyME es lo razonable y evita dejar acceso a datos de
; menores en un equipo compartido.
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
session.use_only_cookies = On
session.cookie_lifetime = 0

; -----------------------------------------------------------------------
; Caché de opcodes
; -----------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; -----------------------------------------------------------------------
; Salida de errores del servidor web: al registro, no a la respuesta.
; -----------------------------------------------------------------------
cgi.fix_pathinfo = 0
fastcgi.read_timeout = 30

; -----------------------------------------------------------------------
; Registro
; -----------------------------------------------------------------------
log_errors_max_len = 0